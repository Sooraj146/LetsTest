<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Let's Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' },
                        primary: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
                        accent: '#8b5cf6'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .glass-panel { background: rgba(30,41,59,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item.active { background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6; color: #60a5fa; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 font-sans min-h-screen relative overflow-x-hidden">

    <!-- Animated background -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
        <div class="absolute -bottom-40 left-20 w-96 h-96 bg-pink-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-4000"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- LOGIN PANEL                                                -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div id="loginPanel" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white tracking-tight">Admin <span class="text-primary-400">Login</span></h1>
                <p class="text-slate-400 text-sm mt-1">Manage exams and students</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="block text-sm font-medium text-slate-300">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-white transition-all">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-sm font-medium text-slate-300">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none text-white transition-all">
                </div>
                <div id="loginError" class="hidden text-red-400 text-sm bg-red-500/10 border border-red-500/20 p-3 rounded-lg text-center"></div>
                <button type="submit" class="w-full py-3 bg-primary-600 hover:bg-primary-500 text-white rounded-xl font-semibold shadow-lg transition-all">Login</button>
            </form>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- MAIN ADMIN PANEL                                           -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div id="adminPanel" class="hidden flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 glass-panel border-r border-dark-700 hidden md:flex flex-col">
            <div class="p-6 border-b border-dark-700">
                <h2 class="text-xl font-bold text-white">Admin <span class="text-primary-400">Portal</span></h2>
                <p id="adminRoleLabel" class="text-xs text-slate-500 mt-1 uppercase tracking-widest font-semibold"></p>
            </div>
            <nav class="flex-1 py-4">
                <div id="mainAdminLinks" class="hidden">
                    <button onclick="showTab('colleges')" class="sidebar-item w-full text-left px-6 py-3 flex items-center gap-3 hover:bg-white/5 active" id="tab-colleges">
                        <span>Colleges</span>
                    </button>
                    <button onclick="showTab('accounts')" class="sidebar-item w-full text-left px-6 py-3 flex items-center gap-3 hover:bg-white/5" id="tab-accounts">
                        <span>Mini Admins</span>
                    </button>
                </div>
                <button onclick="showTab('exams')" class="sidebar-item w-full text-left px-6 py-3 flex items-center gap-3 hover:bg-white/5" id="tab-exams">
                    <span>Exams</span>
                </button>
                <button onclick="showTab('students')" class="sidebar-item w-full text-left px-6 py-3 flex items-center gap-3 hover:bg-white/5" id="tab-students">
                    <span>Students</span>
                </button>
            </nav>
            <div class="p-4 border-t border-dark-700">
                <button onclick="logout()" class="w-full py-2 bg-dark-800 hover:bg-dark-700 text-slate-300 rounded-lg text-sm transition-all">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 id="tabTitle" class="text-3xl font-bold text-white">Dashboard</h1>
                    <p id="tabDescription" class="text-slate-400 mt-1"></p>
                </div>
                <div class="flex items-center gap-4">
                    <div id="collegeFilterContainer" class="hidden">
                        <select id="collegeFilter" class="bg-dark-800 border border-dark-700 text-slate-200 text-sm rounded-lg p-2.5" onchange="loadCurrentTab()">
                            <!-- Colleges populated here -->
                        </select>
                    </div>
                    <p id="adminUsername" class="text-sm font-medium text-slate-300"></p>
                </div>
            </header>

            <!-- ── Tab: Colleges ── -->
            <div id="content-colleges" class="tab-content">
                <div class="flex justify-end mb-4">
                    <button onclick="openCollegeModal()" class="bg-primary-600 hover:bg-primary-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">Add College</button>
                </div>
                <div class="glass-panel rounded-xl overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-dark-800/50 text-slate-400 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="px-6 py-4">College Name</th>
                                <th class="px-6 py-4">Email Domain</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="collegeList" class="divide-y divide-dark-700">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ── Tab: Mini Admins ── -->
            <div id="content-accounts" class="tab-content">
                <div class="flex justify-end mb-4">
                    <button onclick="openAccountModal()" class="bg-primary-600 hover:bg-primary-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">Add Mini Admin</button>
                </div>
                <div class="glass-panel rounded-xl overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-dark-800/50 text-slate-400 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="px-6 py-4">Username</th>
                                <th class="px-6 py-4">College</th>
                                <th class="px-6 py-4">Password</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="accountList" class="divide-y divide-dark-700">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ── Tab: Exams ── -->
            <div id="content-exams" class="tab-content">
                <div class="flex justify-end mb-4">
                    <button onclick="openExamModal()" class="bg-primary-600 hover:bg-primary-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">Create Exam</button>
                </div>
                <div id="examGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards -->
                </div>
            </div>

            <!-- ── Tab: Students ── -->
            <div id="content-students" class="tab-content">
                <div class="flex justify-between items-center mb-4">
                    <div class="text-sm text-slate-400" id="studentCount">Total: 0</div>
                    <button onclick="openStudentModal()" class="bg-primary-600 hover:bg-primary-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">Add Student</button>
                </div>
                <div class="glass-panel rounded-xl overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-dark-800/50 text-slate-400 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="px-6 py-4">Roll No.</th>
                                <th class="px-6 py-4">Name</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentList" class="divide-y divide-dark-700">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ── View: Exam Details ── -->
            <div id="content-exam-details" class="tab-content">
                <button onclick="showTab('exams')" class="text-slate-400 hover:text-white flex items-center gap-1 mb-6 text-sm transition-all">
                    ← Back to Exams
                </button>
                <div class="flex flex-wrap gap-4 mb-8">
                    <button onclick="showSubTab('leaderboard')" class="subtab-item px-4 py-2 rounded-lg text-sm font-medium bg-dark-800 text-slate-400 active" id="subtab-leaderboard">Leaderboard</button>
                    <button onclick="showSubTab('questions')" class="subtab-item px-4 py-2 rounded-lg text-sm font-medium bg-dark-800 text-slate-400" id="subtab-questions">Questions</button>
                    <button onclick="showSubTab('analytics')" class="subtab-item px-4 py-2 rounded-lg text-sm font-medium bg-dark-800 text-slate-400" id="subtab-analytics">Analytics</button>
                </div>

                <!-- Sub-Tab: Leaderboard -->
                <div id="subcontent-leaderboard" class="subtab-content">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold text-white">Rankings</h3>
                        <button onclick="clearUsers()" class="text-red-400 hover:text-red-300 text-xs border border-red-500/20 px-3 py-1 rounded-lg hover:bg-red-500/5 transition-all">Clear All Results</button>
                    </div>
                    <div class="glass-panel rounded-xl overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-dark-800/50 text-slate-400 text-xs uppercase tracking-wider">
                                <tr>
                                    <th class="px-6 py-4">Rank</th>
                                    <th class="px-6 py-4">Student</th>
                                    <th class="px-6 py-4">Score</th>
                                    <th class="px-6 py-4">Time</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboardList" class="divide-y divide-dark-700"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Sub-Tab: Questions -->
                <div id="subcontent-questions" class="subtab-content hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold text-white">Question Bank</h3>
                        <div class="flex gap-2">
                            <button onclick="openBulkModal()" class="bg-dark-800 hover:bg-dark-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition-all">Bulk Upload</button>
                            <button onclick="openQuestionModal()" class="bg-primary-600 hover:bg-primary-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all">Add Question</button>
                        </div>
                    </div>
                    <div id="questionList" class="space-y-4"></div>
                </div>

                <!-- Sub-Tab: Analytics -->
                <div id="subcontent-analytics" class="subtab-content hidden">
                    <h3 class="text-xl font-bold text-white mb-4">Performance Analytics</h3>
                    <div id="analyticsList" class="space-y-6"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- MODALS                                                     -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    
    <!-- Modal Container -->
    <div id="modalOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <!-- Generic Modal -->
        <div id="modalContent" class="glass-panel w-full max-w-lg p-8 rounded-2xl shadow-2xl relative animate-fade-in max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-500 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
