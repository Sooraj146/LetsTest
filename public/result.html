<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Let's Test – View your examination results, score breakdown, and download answer keys.">
  <title>Let's Test – Results</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/result.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%2300e5ff'/><text x='50' y='68' text-anchor='middle' font-size='55' font-weight='bold' fill='%230a0a0f'>L</text></svg>">
</head>
<body>

  <!-- Background decorations for modern space look -->
  <div class="bg-grid"></div>
  <div class="bg-orbs">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main layout container -->
  <div class="page-wrapper page-enter">
    <div class="result-container">
      
      <!-- Top header area for status heading and actions -->
      <header class="result-header">
        <h1 class="result-heading" id="resultHeading">Congratulations!</h1>
        <div class="result-header-actions">
          <a href="dashboard.html" class="rp-btn rp-btn--primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Dashboard
          </a>
          <button class="rp-btn rp-btn--secondary" id="downloadAnswerKey">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Answer Key
          </button>
        </div>
      </header>

      <!-- Main content body (Grid) -->
      <main class="result-main-content">
        
        <!-- Left Section: Score Ring and Stats below it -->
        <section class="result-left-panel glass-card">
          <!-- Circular progress ring -->
          <div class="rp-score-ring-container">
            <div class="rp-score-ring">
              <svg viewBox="0 0 200 200">
                <defs>
                  <linearGradient id="scoreGradientGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#00e676"/>
                    <stop offset="100%" style="stop-color:#00bfa5"/>
                  </linearGradient>
                  <linearGradient id="scoreGradientRed" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff1744"/>
                    <stop offset="100%" style="stop-color:#d50000"/>
                  </linearGradient>
                </defs>
                <circle class="rp-ring-bg" cx="100" cy="100" r="88"/>
                <circle class="rp-ring-fill" cx="100" cy="100" r="88"
                  id="scoreCircleFill"
                  stroke-dasharray="553"
                  stroke-dashoffset="553"/>
              </svg>
              <div class="rp-ring-inner">
                <span class="rp-ring-score" id="totalMarks">0 / 0</span>
                <span class="rp-ring-label">Score</span>
              </div>
            </div>
          </div>

          <!-- Stats Grid below the ring -->
          <div class="rp-stats-grid">
            <div class="rp-stat-card rp-stat-card--correct">
              <span class="rp-stat-card__val" id="correctCount">0</span>
              <span class="rp-stat-card__lbl">Correct</span>
            </div>
            <div class="rp-stat-card rp-stat-card--wrong">
              <span class="rp-stat-card__val" id="wrongCount">0</span>
              <span class="rp-stat-card__lbl">Wrong</span>
            </div>
            <div class="rp-stat-card rp-stat-card--skipped">
              <span class="rp-stat-card__val" id="skippedCount">0</span>
              <span class="rp-stat-card__lbl">Skipped</span>
            </div>
            <div class="rp-stat-card rp-stat-card--pct">
              <span class="rp-stat-card__val" id="scorePercentage">0%</span>
              <span class="rp-stat-card__lbl">Percentage</span>
            </div>
          </div>
        </section>

        <!-- Right Section: Section-wise Performance -->
        <section class="result-right-panel glass-card">
          <h2 class="rp-sections-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent-cyan)" style="vertical-align: middle; margin-right: 8px;">
              <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
            </svg>
            Section-wise Performance
          </h2>
          <div class="rp-sections-list" id="sectionsContainer">
            <!-- Dynamically populated via Javascript -->
          </div>
        </section>

      </main>



    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
