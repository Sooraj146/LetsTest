<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Analysis — Let's Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' },
                        primary: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
                        accent: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    animation: {
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'blob': 'blob 7s infinite',
                        'shimmer': 'shimmer 2s infinite linear',
                    },
                    keyframes: {
                        slideUp: { from: { opacity: '0', transform: 'translateY(20px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
                        fadeIn: { from: { opacity: '0' }, to: { opacity: '1' } },
                        blob: { '0%,100%': { transform: 'translate(0,0) scale(1)' }, '33%': { transform: 'translate(30px,-50px) scale(1.1)' }, '66%': { transform: 'translate(-20px,20px) scale(0.9)' } },
                        shimmer: { '100%': { transform: 'translateX(200%)' } }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #7c3aed 100%); transition: all 0.3s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-dark-950 text-slate-200 font-sans min-h-screen selection:bg-primary-500/30 overflow-x-hidden p-6 md:p-12">

    <!-- Notification Engine -->
    <div id="notificationContainer" class="fixed top-6 left-1/2 -translate-x-1/2 z-[300] flex flex-col gap-3 w-full max-w-sm pointer-events-none"></div>

    <!-- Professional Background -->
    <div class="fixed inset-0 pointer-events-none -z-10 bg-gradient-to-br from-dark-950 via-dark-900 to-dark-950"></div>


    <div class="max-w-5xl w-full mx-auto animate-fade-in">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-8 mb-12">
            <div class="flex items-center gap-6">
                <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center text-emerald-400 border border-emerald-500/20 shadow-lg shadow-emerald-500/5">
                    <i data-lucide="check-circle" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-white leading-tight">Assessment <span class="text-primary-500">Summary</span></h1>
                    <p id="studentGreeting" class="text-slate-500 text-sm mt-1 uppercase tracking-widest font-bold"></p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="window.location.href='/'" class="px-6 py-3 glass rounded-2xl text-slate-400 hover:text-white transition-all text-sm font-bold flex items-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i> Dashboard
                </button>
            </div>
        </div>

        <!-- Main Analysis Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start mb-12">
            
            <!-- Overall Score (Large) -->
            <div class="lg:col-span-5 glass rounded-[2.5rem] p-10 flex flex-col items-center justify-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-right from-primary-500 to-accent-500 opacity-20"></div>
                <h3 class="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-10">Score distribution</h3>
                
                <div class="relative w-full max-w-[280px] aspect-square mb-10">
                    <canvas id="donutChart"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <div class="flex items-baseline gap-2">
                            <span id="centerScore" class="text-6xl font-black text-white">--</span>
                            <span class="text-2xl font-black text-slate-700">/</span>
                            <span id="totalQuestionsLabel" class="text-2xl font-black text-slate-500">--</span>
                        </div>
                        <span class="text-[10px] text-slate-600 uppercase font-black tracking-[0.2em] mt-1">Total Points Scored</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-6 w-full">
                    <div class="text-center">
                        <p class="text-[10px] font-black uppercase text-slate-500 mb-2">Correct</p>
                        <p id="correctCount" class="text-xl font-black text-emerald-400">--</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-black uppercase text-slate-500 mb-2">Wrong</p>
                        <p id="wrongCount" class="text-xl font-black text-red-400">--</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-black uppercase text-slate-500 mb-2">Skipped</p>
                        <p id="skippedCount" class="text-xl font-black text-slate-400">--</p>
                    </div>
                </div>

                <div id="accuracyBadge" class="mt-12 px-6 py-2 rounded-full bg-primary-500/10 border border-primary-500/20 text-primary-400 text-xs font-black uppercase tracking-widest">
                    --% Precision
                </div>
            </div>

            <!-- Sectional Breakdown -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass rounded-[2.5rem] p-10">
                    <h3 class="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-8">Performance by Topic</h3>
                    <div id="sectionScoresContainer" class="space-y-6">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Export Action -->
                <div class="glass rounded-[2rem] p-8 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div>
                        <h4 class="text-white font-black uppercase tracking-widest text-sm">Review your work</h4>
                        <p class="text-slate-500 text-xs mt-1">Download the official answer key for this assessment.</p>
                    </div>
                    <button id="answerKeyBtn" onclick="downloadAnswerKey()" class="w-full md:w-auto px-8 py-4 btn-primary text-white rounded-2xl font-black uppercase tracking-widest text-[10px] shadow-xl shadow-primary-500/20 flex items-center justify-center gap-3">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        Download Answer Key
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/result.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
