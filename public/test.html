<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCA Test - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        primary: { 500: '#3b82f6', 600: '#2563eb' },
                        accent: '#8b5cf6'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark-900 text-slate-200 font-sans h-[100dvh] flex overflow-hidden">

    <!-- ======= MOBILE OVERLAY (tap to close sidebar) ======= -->
    <div id="sidebarOverlay"
         class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden md:hidden"
         onclick="closeSidebar()"></div>

    <!-- ======= SIDEBAR ======= -->
    <!-- Mobile: fixed drawer sliding from left | Desktop: static left panel -->
    <aside id="sidebar"
           class="fixed md:relative left-0 top-0 z-40 w-72 md:w-64 h-full
                  glass-panel border-r border-dark-700 flex flex-col
                  -translate-x-full md:translate-x-0
                  transition-transform duration-300 ease-in-out">

        <!-- Sidebar Header -->
        <div class="p-5 border-b border-dark-700 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">MCA <span class="text-primary-500">Test</span></h1>
                <p id="studentName" class="text-xs text-slate-400 mt-0.5 truncate max-w-[180px]">Student Name</p>
            </div>
            <!-- Close button — mobile only -->
            <button onclick="closeSidebar()"
                    class="md:hidden p-1.5 rounded-lg hover:bg-dark-700 text-slate-400 hover:text-white transition-colors flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Sections Nav -->
        <div class="p-4 flex-1 overflow-y-auto custom-scrollbar">
            <h2 class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-3 ml-1">Sections</h2>
            <nav id="sectionNav" class="space-y-1"></nav>
        </div>

        <!-- Progress + Submit -->
        <div class="p-4 border-t border-dark-700">
            <div class="mb-3">
                <div class="text-xs text-slate-400 mb-1 flex justify-between">
                    <span>Progress</span>
                    <span id="progressText" class="font-medium text-slate-300">0/30</span>
                </div>
                <div class="w-full bg-dark-800 rounded-full h-1.5">
                    <div id="progressBar" class="bg-gradient-to-r from-primary-500 to-accent h-1.5 rounded-full transition-all duration-500" style="width:0%"></div>
                </div>
            </div>
            <button id="finalSubmitBtn"
                    class="w-full py-2.5 bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/50 rounded-lg font-medium transition-colors flex items-center justify-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Submit Test
            </button>
        </div>
    </aside>

    <!-- ======= MAIN CONTENT ======= -->
    <main class="flex-1 flex flex-col min-w-0 h-full relative bg-dark-900/50">

        <!-- Top Header -->
        <header class="px-4 py-3 md:px-6 md:py-4 border-b border-dark-700 glass-panel flex items-center gap-3 flex-shrink-0">
            <!-- Hamburger button — mobile only -->
            <button onclick="openSidebar()"
                    class="md:hidden p-2 rounded-lg hover:bg-dark-800 text-slate-400 hover:text-white transition-colors flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="flex-1 min-w-0">
                <h2 id="currentSectionTitle" class="text-base md:text-xl font-semibold text-white truncate">Loading...</h2>
            </div>
            <div class="text-xs md:text-sm px-2.5 py-1 bg-dark-800 rounded-full border border-dark-700 text-slate-300 flex-shrink-0">
                Q <span id="currentQuestionNum" class="font-bold text-white">1</span>/6
            </div>
        </header>

        <!-- Question Area -->
        <div class="flex-1 overflow-y-auto custom-scrollbar">
            <div class="max-w-3xl mx-auto w-full p-4 md:p-10 flex flex-col justify-center min-h-full">
                <!-- Skeleton Loader -->
                <div id="loader" class="animate-pulse space-y-6 hidden">
                    <div class="h-5 bg-dark-700 rounded w-3/4"></div>
                    <div class="space-y-3">
                        <div class="h-14 bg-dark-800 rounded-xl"></div>
                        <div class="h-14 bg-dark-800 rounded-xl"></div>
                        <div class="h-14 bg-dark-800 rounded-xl"></div>
                        <div class="h-14 bg-dark-800 rounded-xl"></div>
                    </div>
                </div>
                <!-- Question Content -->
                <div id="questionContainer" class="transition-opacity duration-300 opacity-0">
                    <h3 id="questionText" class="text-base md:text-xl font-medium text-white mb-6 leading-relaxed">
                        Loading question...
                    </h3>
                    <div id="optionsContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <footer class="px-4 py-3 md:px-6 md:py-4 border-t border-dark-700 glass-panel flex justify-between items-center flex-shrink-0">
            <button id="prevBtn"
                    class="px-4 md:px-6 py-2.5 rounded-lg border border-dark-700 text-slate-300 hover:bg-dark-800 hover:text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Prev
            </button>
            <button id="nextBtn"
                    class="px-4 md:px-6 py-2.5 rounded-lg bg-primary-600 hover:bg-primary-500 text-white font-medium shadow-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 text-sm">
                Next
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </footer>
    </main>

    <!-- Background blur -->
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-900 rounded-full filter blur-[100px] opacity-20"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-accent rounded-full filter blur-[100px] opacity-15"></div>
    </div>

    <!-- Submit Modal -->
    <div id="submitModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-xl p-6 md:p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-xl md:text-2xl font-bold text-white mb-3">Confirm Submission</h3>
            <p class="text-slate-400 text-sm md:text-base mb-6">Are you sure you want to submit your test? You will not be able to change your answers after submission.</p>
            <div class="flex justify-end gap-3">
                <button id="cancelSubmitBtn" class="px-4 py-2 rounded-lg border border-dark-700 text-slate-300 hover:bg-dark-700 transition-colors text-sm">Cancel</button>
                <button id="confirmSubmitBtn" class="px-4 py-2 rounded-lg bg-primary-600 hover:bg-primary-500 text-white shadow-lg transition-colors text-sm">Yes, Submit</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/test.js"></script>
</body>
</html>
