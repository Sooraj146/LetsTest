<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Session — Let's Test</title>
    <meta name="description" content="Secure candidate assessment interface.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 0.7s linear infinite; }

        body { overflow: hidden; }

        /* Sidebar scroll area */
        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 16px;
        }

        /* Sidebar footer */
        .sidebar-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* Sidebar mobile overlay */
        #sidebarOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5,7,12,0.7);
            backdrop-filter: blur(4px);
            z-index: 49;
        }

        #sidebarOverlay.open { display: block; }

        /* Desktop topbar layout classes */
        .topbar-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .topbar-row-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-row-right {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-left: auto;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.open { transform: translateX(0); box-shadow: 8px 0 40px rgba(0,0,0,0.5); }
            .exam-main { margin-left: 0 !important; }
            .exam-topbar { padding: 0 16px; height: auto !important; min-height: 76px; }
            .exam-question-area { padding: 20px 12px; }

            /* Topbar Mobile Overrides */
            .topbar-wrapper {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 0;
                gap: 8px;
            }
            .topbar-row-left {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
            }
            .topbar-row-right {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                margin-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                padding-top: 6px;
                gap: 12px;
            }
            #topbarExamName {
                font-size: 1.15rem !important;
                font-weight: 800 !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: calc(100vw - 80px);
            }
            #topbarStudentName {
                font-size: 0.95rem !important;
                font-weight: 700 !important;
            }
            .topbar-student-info {
                text-align: left !important;
            }
            .topbar-session-label {
                display: none !important;
            }
            .timer-display {
                font-size: 0.85rem !important;
                padding: 6px 12px !important;
            }
            .timer-label {
                display: none !important;
            }

            /* Question Font size & Container Padding Mobile Overrides */
            #questionContainer {
                padding: 24px 20px !important;
            }
            #questionText {
                font-size: 1.25rem !important;
                margin-bottom: 24px !important;
            }
        }
    </style>
</head>
<body>
    <!-- Background Grid -->
    <div class="bg-grid"></div>

<!-- Toast -->
<div id="notificationContainer" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;min-width:320px;pointer-events:none;"></div>

<!-- Confirm Modal -->
<div id="confirmOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-card fade-up">
        <div id="confirmIconWrap" style="width:52px;height:52px;border-radius:12px;background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
        </div>
        <h3 id="confirmTitle" style="font-size:1.15rem;font-weight:800;color:var(--text-primary);margin-bottom:10px;letter-spacing:-0.02em;"></h3>
        <p id="confirmMessage" style="font-size:0.85rem;color:var(--text-secondary);line-height:1.6;margin-bottom:24px;"></p>
        <div style="display:flex;gap:12px;">
            <button id="confirmCancelBtn" class="btn btn-ghost" style="flex:1;">Cancel</button>
            <button id="confirmProceedBtn" class="btn btn-danger" style="flex:1;">Submit</button>
        </div>
    </div>
</div>

<!-- Mobile sidebar overlay -->
<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ═══ LAYOUT ═══ -->
<div class="exam-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div>
                <div class="sidebar-brand">Let's Test</div>
            </div>
            <!-- Sidebar Timer (shown on laptop only) -->
            <div id="sidebarTimerContainer" style="display:none;margin-left:auto;margin-right:10px;">
                <div class="sidebar-timer-display">
                    <span id="sidebarTimerDisplay">00:00</span>
                </div>
            </div>
            <!-- Mobile close -->
            <button onclick="closeSidebar()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;margin-top:2px;display:none;" id="sidebarCloseBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="sidebar-scroll" id="sidebarScroll">

            <div id="sectionNav"></div>
        </div>

        <!-- Footer: submit -->
        <div class="sidebar-footer">
            <div style="margin-bottom:14px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span style="font-size:0.88rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">Completion</span>
                    <span id="progressText" style="font-size:1rem;font-weight:700;color:var(--cyan);font-family:'JetBrains Mono',monospace;">0/0</span>
                </div>
                <div class="progress-wrap">
                    <div class="progress-bar" id="progressBar" style="width:0%;"></div>
                </div>
            </div>
            <button id="finalSubmitBtn" class="btn btn-danger" style="width:100%;font-size:0.98rem;padding:16px;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                Submit Assessment
            </button>
        </div>
    </aside>

    <!-- ── Main Area ── -->
    <main class="exam-main">

        <!-- Top bar -->
        <div class="exam-topbar">
            <div class="topbar-wrapper">
                <!-- Left: Exam Name & Mobile menu button -->
                <div class="topbar-row-left">
                    <!-- Mobile menu -->
                    <button onclick="openSidebar()" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:4px;margin-right:8px;display:none;" id="menuBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <div id="topbarExamName" style="font-size: 1.55rem; font-weight: 900; color: #fff; letter-spacing: -0.02em; text-shadow: 0 0 15px rgba(255,255,255,0.15);">Loading Assessment...</div>
                </div>

                <!-- Right: Student Name & Timer -->
                <div class="topbar-row-right">
                    <div class="topbar-student-info" style="text-align: right; display: flex; flex-direction: column;">
                        <span id="topbarStudentName" style="font-size: 1.15rem; font-weight: 800; color: var(--cyan); text-shadow: 0 0 15px rgba(0,242,255,0.25);">Candidate</span>
                        <span class="topbar-session-label" style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;">Assessment Session</span>
                    </div>

                    <!-- Timer -->
                    <div id="testTimerContainer" style="display:none;">
                        <div id="timerBadge" class="timer-display">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                            </svg>
                            <span id="testTimerDisplay">00:00</span>
                            <span class="timer-label" style="font-size:0.72rem;font-weight:600;color:inherit;opacity:0.8;">Remaining</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="exam-question-area" id="examScrollArea">

            <!-- Loader skeleton -->
            <div id="loader" style="display:none;">
                <div style="width:120px;height:22px;background:var(--bg-elevated);border-radius:6px;margin-bottom:28px;"></div>
                <div style="width:100%;height:110px;background:var(--bg-elevated);border-radius:14px;margin-bottom:28px;"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                    <div style="height:62px;background:var(--bg-elevated);border-radius:10px;"></div>
                    <div style="height:62px;background:var(--bg-elevated);border-radius:10px;"></div>
                    <div style="height:62px;background:var(--bg-elevated);border-radius:10px;"></div>
                    <div style="height:62px;background:var(--bg-elevated);border-radius:10px;"></div>
                </div>
            </div>

            <!-- Question content -->
            <div id="questionContainer" class="card" style="opacity:0; transition:all 0.4s cubic-bezier(0.16, 1, 0.3, 1); max-width: 1350px; width: 100%; margin: 0 auto; padding: 48px; border-radius: var(--radius-xl); border: 1px solid var(--border-cyan); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 242, 255, 0.05); position: relative; overflow: hidden;">
                <!-- Decorative glow -->
                <div style="position: absolute; top: -50px; left: -50px; width: 150px; height: 150px; background: var(--cyan-dark); filter: blur(60px); border-radius: 50%; pointer-events: none;"></div>

                <div class="question-badge" id="questionBadge" style="margin-bottom: 24px;">Question 1</div>
                <div class="question-text" id="questionText" style="padding: 0; background: transparent; border: none; font-size: 1.8rem; font-weight: 700; color: #fff; line-height: 1.5; margin-bottom: 32px;"></div>
                <div class="options-grid" id="optionsContainer"></div>

                <!-- Navigation -->
                <div style="display:flex;align-items:center;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid var(--border);gap:16px;">
                    <button type="button" id="prevBtn" class="btn btn-ghost exam-nav-btn" style="gap:8px;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                        Previous
                    </button>

                    <button type="button" id="reviewBtn" onclick="toggleReview()" class="btn exam-nav-btn" style="color:var(--yellow);gap:8px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                        </svg>
                        Mark for Review
                    </button>

                    <button type="button" id="nextBtn" class="btn btn-cyan exam-nav-btn" style="gap:8px;">
                        Next
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/test.js"></script>
<script>
    // Show mobile elements
    if (window.innerWidth <= 768) {
        document.getElementById('menuBtn').style.display = '';
        document.getElementById('sidebarCloseBtn').style.display = '';
    }
</script>
</body>
</html>
