<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Let's Test – Secure Online Examination Platform. Login with your Roll Number and Email to access your tests.">
  <title>Let's Test – Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%2300e5ff'/><text x='50' y='68' text-anchor='middle' font-size='55' font-weight='bold' fill='%230a0a0f'>L</text></svg>">
</head>
<body>

  <!-- Background Effects -->
  <canvas id="particles-canvas"></canvas>
  <div class="bg-grid"></div>
  <div class="bg-orbs">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
  </div>
  <div class="scanline-overlay"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Login Page -->
  <div class="page-wrapper login-page page-enter">
    <div class="login-card glass-card glass-card--strong">
      <div class="login-card__glow"></div>

      <!-- Branding -->
      <div class="login-branding">
        <div class="login-logo">
          <div class="login-logo__shape">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
        </div>
        <h1 class="login-title neon-text">Let's Test</h1>
        <h2 class="login-subtitle">Candidate Login</h2>
      </div>

      <div class="divider"></div>

      <!-- Login Form -->
      <form class="login-form" id="loginForm" novalidate>
        <!-- Roll Number -->
        <label class="input-label" for="rollNumber">Roll Number</label>
        <div class="login-input-wrapper" id="rollWrapper">
          <input
            type="text"
            class="input-field"
            id="rollNumber"
            placeholder="Eg: 50"
            autocomplete="off"
            required
          >
          <svg class="input-icon-left" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
          <div class="input-line"></div>
        </div>

        <!-- Email -->
        <label class="input-label" for="emailAddress">Email Address</label>
        <div class="login-input-wrapper" id="emailWrapper">
          <input
            type="email"
            class="input-field"
            id="emailAddress"
            placeholder="Eg: mail@institution.ac.in"
            autocomplete="email"
            required
          >
          <svg class="input-icon-left" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <div class="input-line"></div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn--primary btn--full btn--lg login-btn" id="loginBtn">
          <span class="btn-text">ACCESS PORTAL</span>
          <div class="btn-spinner spinner"></div>
        </button>
      </form>
    </div>
  </div>

  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
