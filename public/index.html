<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCA Test - Online Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        },
                        primary: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        },
                        accent: '#8b5cf6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark-900 text-slate-200 font-sans min-h-[100dvh] flex items-center justify-center relative overflow-hidden p-4">
    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute top-40 -left-40 w-96 h-96 bg-accent rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-40 left-20 w-96 h-96 bg-pink-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <div class="glass-panel w-full max-w-md p-6 md:p-8 rounded-2xl shadow-2xl relative z-10 transition-all duration-500 md:hover:scale-[1.02]">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2 tracking-tight">MCA <span class="text-primary-500">Test</span></h1>
            <p class="text-slate-400 text-sm">Enter your details to begin the assessment</p>
        </div>

        <form id="registerForm" class="space-y-6">
            <div class="space-y-2">
                <label for="name" class="block text-sm font-medium text-slate-300">Full Name</label>
                <input type="text" id="name" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all text-white placeholder-slate-500 shadow-inner" placeholder="Sooraj V">
            </div>

            <div class="space-y-2">
                <label for="rollNumber" class="block text-sm font-medium text-slate-300">Roll Number</label>
                <input type="text" id="rollNumber" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all text-white placeholder-slate-500 shadow-inner" placeholder="50">
            </div>

            <div class="space-y-2">
                <label for="email" class="block text-sm font-medium text-slate-300">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-dark-800 border border-dark-700 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all text-white placeholder-slate-500 shadow-inner" placeholder="25c042.sooraj@gectcr.ac.in">
            </div>

            <div id="errorMsg" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg text-center"></div>

            <div id="timerContainer" class="hidden flex flex-col items-center justify-center p-4 bg-dark-800/80 border border-primary-500/30 rounded-lg">
                <p class="text-sm text-slate-400 mb-1" id="timerLabel">Test Starts In</p>
                <p class="text-2xl font-mono font-bold text-primary-400 tracking-wider" id="timerDisplay">--:--:--</p>
            </div>

            <button type="submit" id="startBtn" class="w-full py-3 px-4 bg-gradient-to-r from-primary-600 to-accent hover:from-primary-500 hover:to-purple-500 text-white rounded-lg font-semibold shadow-lg transform transition hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-dark-900 focus:ring-primary-500 flex items-center justify-center gap-2">
                <span id="startBtnText">Start Assessment</span>
                <svg id="startBtnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
